# Keyboard and touchpad input settings
input {
    kb_layout = us
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 7.0

    touchpad {
        natural_scroll = true
        scroll_factor = 10.0
    }
}

# Cursor settings - modify as you prefer
cursor {
    # Cursor size in pixels (adjust this value to change cursor size)
    # Common values: 16, 24, 32, 48, 64
    size = 24
    
    # Cursor theme name (e.g., Adwaita, Breeze, Bibata)
    theme = Adwaita
    
    # Enable/disable hardware cursor
    no_hardware_cursors = false
    
    # Cursor behavior with hotspot
    enable_hyprcursor = true
}
